opencollection: 1.0.0

info:
  name: opnsense apitesting
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: basic
    username: [api key from opnsense]
    password: [api secret from opnsense]
  variables:
    - name: ""
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
