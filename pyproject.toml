[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wanusage"
dynamic = ["version"]
description = "Report WAN usage from the OPNsense vnStat API."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Greg" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
wanusage = "wanusage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wanusage"]

[tool.hatch.version]
path = "src/wanusage/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
