[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "wanusage"
dynamic = ["version"]
description = "Report WAN usage from the OPNsense vnStat API."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
authors = [
  { name = "Greg Pfountz" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "hatchling>=1.32.4",
  "mypy>=2.4.0",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "ruff>=0.17.2",
]

[project.scripts]
wanusage = "wanusage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wanusage"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "wanusage/legal_texts/LICENSE"
"COPYRIGHT" = "wanusage/legal_texts/COPYRIGHT"
"THIRD_PARTY_NOTICES.md" = "wanusage/legal_texts/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/versioning.md",
  "/AGENTS.md",
  "/LICENSE", "/COPYRIGHT", "/LICENSING.md", "/THIRD_PARTY_NOTICES.md",
  "/wanusage.toml", "/.gitattributes", "/.gitignore", "/.github/workflows/ci.yml",
]

[tool.hatch.version]
path = "src/wanusage/__init__.py"
pattern = '^__version__(?:\s*:\s*str)?\s*=\s*"(?P<version>[^"]+)"'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
